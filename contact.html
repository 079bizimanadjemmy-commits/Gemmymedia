<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GemmyMedia - Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="scrolled">
        <a href="index.html" class="logo">GEMMY MEDIA</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="games.html">Games</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <div style="padding: 150px 4% 4rem; max-width: 600px; margin: 0 auto;">
        <h1 style="font-size: 3rem; margin-bottom: 2rem;">Get in Touch</h1>
        <div class="admin-form">
            <div class="form-group">
                <label>Name</label>
                <input type="text" placeholder="Your Name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Your Email">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea rows="5" placeholder="How can we help?"></textarea>
            </div>
            <button class="btn btn-primary" style="width: 100%;">Send Message</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 GemmyMedia. All rights reserved.</p>
    </footer>

    <!-- AI Assistant -->
    <div id="ai-chat-container">
        <div id="ai-chat-box">
            <div class="chat-header">Gemmy Assistant</div>
            <div id="ai-messages" class="chat-messages">
                <div class="message message-ai">Hi! Need help with something? You can also ask me about our content!</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="ai-input" placeholder="Ask me anything...">
                <button id="ai-send" class="btn btn-primary" style="padding: 0.5rem 1rem;">Send</button>
            </div>
        </div>
        <div id="ai-chat-toggle">AI</div>
    </div>

    <script src="js/app.js"></script>
    <script type="module" src="js/ai-assistant.js"></script>
</body>
</html>
